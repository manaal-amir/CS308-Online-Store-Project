services:
  postgres:
    image: postgres:16
    container_name: vinyl-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vinyl
      POSTGRES_PASSWORD: vinyl_dev
      POSTGRES_DB: vinyl_store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: